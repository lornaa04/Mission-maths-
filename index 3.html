<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6c5ce7"><title>Mission Maths V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#eef1ff,#fff8e8);color:#20243a}.app{max-width:520px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px;color:#5d4fd4}.stars{background:#fff;padding:9px 12px;border-radius:18px;box-shadow:0 5px 18px #0001;font-weight:800}.card{background:#fff;border-radius:28px;padding:22px;box-shadow:0 14px 40px #463cc01a;margin-top:14px}.hero{text-align:center;padding:28px 18px}.rocket{font-size:58px}.hero h1{font-size:34px;margin:8px 0;color:#5d4fd4}.hero p{color:#69708a}.modes{display:grid;gap:11px;margin-top:18px}.mode{border:0;border-radius:18px;padding:16px;text-align:left;background:#f2f1ff;font-size:17px;font-weight:800;color:#3d357f}.mode span{display:block;font-size:13px;font-weight:500;color:#777;margin-top:4px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{background:#f7f7fb;border-radius:16px;padding:9px;text-align:center;font-weight:800}.stat b{display:block;font-size:19px}.progress{height:10px;background:#e9e8f4;border-radius:10px;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:#6c5ce7;border-radius:10px}.question{text-align:center}.qnum{color:#777;font-weight:700}.problem{font-size:46px;font-weight:950;margin:18px 0;color:#2d3150}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{border:3px solid #ececf6;background:#fff;border-radius:20px;padding:18px;font-size:24px;font-weight:900;color:#343957}.correct{border-color:#27b77a!important;background:#e9fff6!important}.wrong{border-color:#ef5b68!important;background:#fff0f2!important}.feedback{text-align:center;min-height:32px;font-weight:900;font-size:17px;margin:12px 0}.result{text-align:center}.trophy{font-size:64px}.score{font-size:46px;font-weight:950;color:#5d4fd4}.badge{display:inline-block;background:#fff1a8;border-radius:20px;padding:9px 15px;font-weight:900}.mission{background:#f4f2ff;border-radius:18px;padding:14px;text-align:left;margin:16px 0}.btn{width:100%;border:0;border-radius:18px;padding:16px;font-size:17px;font-weight:900;background:#6c5ce7;color:#fff}.hidden{display:none}.parent{font-size:12px;color:#85899b;margin-top:15px}
</style></head><body><div class="app">
<div class="top"><div class="brand">🚀 Mission Maths</div><div class="stars">⭐ <span id="stars">0</span></div></div>
<section id="home" class="card hero"><div class="rocket">🚀</div><h1>MISSION MATHS</h1><p>Deviens un héros des maths !</p><h2>Choisis ta mission</h2>
<div class="modes">
<button class="mode" onclick="start('add')">➕ Mission Addition<span>Calcule et gagne des étoiles</span></button>
<button class="mode" onclick="start('sub')">➖ Mission Soustraction<span>Relève le défi des nombres</span></button>
<button class="mode" onclick="start('mix')">🌟 Mission Mixte<span>Le niveau expert !</span></button>
</div><div class="parent">🎓 5 niveaux • ❤️ 3 vies • 🏆 récompenses</div></section>
<section id="game" class="card hidden"><div class="stats"><div class="stat">Niveau<b id="level">1</b></div><div class="stat">Vies<b id="lives">❤️❤️❤️</b></div><div class="stat">Score<b id="score">0</b></div></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="question"><div class="qnum" id="qnum"></div><div class="problem" id="problem"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div></div></section>
<section id="result" class="card result hidden"><div class="trophy">🏆</div><h1>Mission terminée !</h1><div class="score" id="finalScore"></div><div class="badge" id="badge"></div><p id="finalText"></p><div class="mission"><b>🎯 Prochain objectif</b><br><span id="goal"></span></div><button class="btn" onclick="goHome()">🚀 Nouvelle mission</button></section>
</div>
<script>
let mode,q,score,level,lives,correct,current,locked;
const $=id=>document.getElementById(id);let stars=Number(localStorage.getItem("mmStars")||0);$("stars").textContent=stars;
function start(m){mode=m;q=0;score=0;level=1;lives=3;correct=0;locked=false;$("home").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");next()}
function limits(){return level==1?[1,10]:level==2?[2,20]:level==3?[5,50]:level==4?[10,80]:[10,100]}
function makeQ(){let r=limits(),a=Math.floor(Math.random()*(r[1]-r[0]+1))+r[0],b=Math.floor(Math.random()*(r[1]-r[0]+1))+r[0],op=mode=="add"?"+":mode=="sub"?"-":Math.random()<.5?"+":"-";if(op=="-"&&b>a)[a,b]=[b,a];return [a,b,op,op=="+"?a+b:a-b]}
function next(){if(q>=10||lives<=0)return finish();locked=false;$("qnum").textContent="Mission "+(q+1)+" / 10";$("level").textContent=level;$("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);$("score").textContent=score;$("bar").style.width=q*10+"%";$("feedback").textContent="";let x=makeQ();current=x[3];$("problem").textContent=x[0]+" "+x[2]+" "+x[1]+" = ?";let s=new Set([current]);while(s.size<4){let v=current+Math.floor(Math.random()*9)-4;if(v>=0)s.add(v)}$("answers").innerHTML=[...s].sort(()=>Math.random()-.5).map(v=>'<button class="answer" onclick="answer(this,'+v+')">'+v+"</button>").join("")}
function answer(btn,v){if(locked)return;locked=true;if(v===current){btn.classList.add("correct");correct++;let gain=10*level;score+=gain;stars++;localStorage.setItem("mmStars",stars);$("stars").textContent=stars;$("feedback").textContent="🎉 Excellent ! +"+gain+" points";if(q<9&&(q+1)%3===0)level=Math.min(5,level+1)}else{btn.classList.add("wrong");lives--;$("feedback").textContent="💪 Presque ! Bonne réponse : "+current}q++;setTimeout(next,800)}
function finish(){$("game").classList.add("hidden");$("result").classList.remove("hidden");$("finalScore").textContent=score+" ⭐";let p=correct/10;$("badge").textContent=p===1?"👑 Génie des maths !":p>=.8?"🏆 Super héros !":p>=.5?"🌟 Bravo !":"💪 Courage, continue !";$("finalText").textContent="Tu as réussi "+correct+" mission"+(correct>1?"s":"")+" sur 10 et atteint le niveau "+level+".";$("goal").textContent=correct<10?"Refais une mission pour battre ton score !":"Défi suivant : garde ton sans-faute et monte jusqu’au niveau 5 !"}
function goHome(){$("result").classList.add("hidden");$("home").classList.remove("hidden")}
</script></body></html>
